[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-meeting-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "pydantic-settings>=2.6,<3",
    "SQLAlchemy[asyncio]>=2.0,<3",
    "asyncmy>=0.2,<1",
    "cryptography>=43,<46",
    "pymongo>=4.13,<5",
    "redis>=5,<8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-anyio>=0.0.0",
    "ruff>=0.9,<1",
    "pyright>=1.1,<2",
    "testcontainers>=4.9,<5",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = ["integration: requires Docker containers"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pyright]
include = ["app", "tests"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "basic"
